<!DOCTYPE html>
<!--
  This file is NOT the app. It exists only because Capacitor's CLI tooling
  requires `webDir` (see capacitor.config.json) to point at a real directory
  with an index.html in it.

  At runtime, capacitor.config.json's `server.url` tells the native shell to
  load https://chat.parasyte.cloud directly instead of anything in this
  folder — the real app (index.html at the repo root, one level up) is
  deployed there via `wrangler deploy`, same as the web version, and the
  native app picks up every change instantly with no rebuild or app store
  resubmission needed.

  If you ever switch back to bundling a local copy instead (removing
  `server.url` from capacitor.config.json), copy the real index.html here
  and run `npx cap sync` — until then, editing this file does nothing.
-->
